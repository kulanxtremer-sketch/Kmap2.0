<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4-Variable K-Map Solver</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { color: #333; }
    input {
      padding: 8px;
      width: 250px;
      border: 1px solid #aaa;
      border-radius: 6px;
      margin-right: 10px;
    }
    button {
      padding: 8px 15px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }
    table { margin-top: 20px; border-collapse: collapse; position: relative; }
    td, th {
      border: 1px solid #333;
      text-align: center;
      font-size: 18px;
      width: 60px;
      height: 60px;
      position: relative;
    }
    th { background: #ddd; }
    .group-box {
      position: absolute;
      border: 3px solid;
      border-radius: 10px;
      opacity: 0.35;
      pointer-events: none;
    }
    #expression {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>4-Variable K-Map Solver</h1>
  <p>Enter minterms (0–15) separated by commas:</p>
  <div>
    <input type="text" id="minterms" placeholder="e.g. 1,5,7,12">
    <button onclick="generateKmap()">Solve</button>
  </div>

  <div style="position:relative;">
    <table id="kmap"></table>
  </div>

  <div id="expression"></div>

  <script>
    // K-map structure: vertical order 0,1,3,2
    const kmapOrder = [
      [0, 1, 3, 2],
      [4, 5, 7, 6],
      [12, 13, 15, 14],
      [8, 9, 11, 10]
    ];

    const rowLabels = ["00","01","11","10"]; // AB
    const colLabels = ["00","01","11","10"]; // CD
    const variables = ["A","B","C","D"];
    const colors = ["red","blue","green","purple","orange","brown","pink","cyan"];

    function getBinary(num){ return num.toString(2).padStart(4,"0"); }

    function generateKmap() {
      document.querySelectorAll(".group-box").forEach(e => e.remove());
      let input = document.getElementById("minterms").value;
      let minterms = input.split(",").map(n => parseInt(n.trim())).filter(n => !isNaN(n) && n>=0 && n<=15);

      // Build K-map table
      let table = "<tr><th>AB\\CD</th>";
      colLabels.forEach(cl => table += `<th>${cl}</th>`);
      table += "</tr>";
      for (let r=0; r<4; r++) {
        table += `<tr><th>${rowLabels[r]}</th>`;
        for (let c=0; c<4; c++) {
          let num = kmapOrder[c][r];
          let val = minterms.includes(num) ? 1 : 0;
          table += `<td id="cell-${num}">${val}<br><small>(${num})</small></td>`;
        }
        table += "</tr>";
      }
      document.getElementById("kmap").innerHTML = table;

      // Find optimal grouping
      let groups = findMinimalGroups(minterms);
      drawGroups(groups);

      let sop = groups.map(g => groupToExpression(g)).join(" + ");
      document.getElementById("expression").innerText = "Minimal SOP: " + (sop || "0");
    }

    function findMinimalGroups(minterms) {
      if (minterms.length === 0) return [];
      
      // Generate all possible groups
      let allGroups = [];
      
      // 8-cell groups (two full rows or two full columns with wraparound)
      // Two consecutive rows
      for (let r = 0; r < 4; r++) {
        let cells = [];
        for (let i = 0; i < 2; i++) {
          for (let c = 0; c < 4; c++) {
            cells.push([(r + i) % 4, c]);
          }
        }
        if (isValidGroup(cells, minterms)) {
          allGroups.push({cells, size: 8, type: 'rows'});
        }
      }
      
      // Two consecutive columns
      for (let c = 0; c < 4; c++) {
        let cells = [];
        for (let r = 0; r < 4; r++) {
          for (let i = 0; i < 2; i++) {
            cells.push([r, (c + i) % 4]);
          }
        }
        if (isValidGroup(cells, minterms)) {
          allGroups.push({cells, size: 8, type: 'cols'});
        }
      }
      
      // 4-cell groups
      // Full rows
      for (let r = 0; r < 4; r++) {
        let cells = [];
        for (let c = 0; c < 4; c++) {
          cells.push([r, c]);
        }
        if (isValidGroup(cells, minterms)) {
          allGroups.push({cells, size: 4, type: 'row'});
        }
      }
      
      // Full columns
      for (let c = 0; c < 4; c++) {
        let cells = [];
        for (let r = 0; r < 4; r++) {
          cells.push([r, c]);
        }
        if (isValidGroup(cells, minterms)) {
          allGroups.push({cells, size: 4, type: 'col'});
        }
      }
      
      // 2x2 squares
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          let cells = [
            [r, c],
            [r, (c + 1) % 4],
            [(r + 1) % 4, c],
            [(r + 1) % 4, (c + 1) % 4]
          ];
          if (isValidGroup(cells, minterms)) {
            allGroups.push({cells, size: 4, type: 'square'});
          }
        }
      }
      
      // 2-cell groups
      // Horizontal pairs
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          let cells = [
            [r, c],
            [r, (c + 1) % 4]
          ];
          if (isValidGroup(cells, minterms)) {
            allGroups.push({cells, size: 2, type: 'horizontal'});
          }
        }
      }
      
      // Vertical pairs
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          let cells = [
            [r, c],
            [(r + 1) % 4, c]
          ];
          if (isValidGroup(cells, minterms)) {
            allGroups.push({cells, size: 2, type: 'vertical'});
          }
        }
      }
      
      // Single cells
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          let num = kmapOrder[c][r];
          if (minterms.includes(num)) {
            allGroups.push({cells: [[r, c]], size: 1, type: 'single'});
          }
        }
      }
      
      // Sort groups by size (largest first)
      allGroups.sort((a, b) => b.size - a.size);
      
      // Select minimal set of groups that covers all minterms
      let selectedGroups = [];
      let coveredMinterms = new Set();
      
      // First, add all essential prime implicants
      for (let group of allGroups) {
        let groupMinterms = new Set(group.cells.map(([r, c]) => kmapOrder[c][r]));
        let isEssential = false;
        
        // Check if this group contains a minterm not covered by any other group of the same size
        for (let minterm of groupMinterms) {
          if (!coveredMinterms.has(minterm)) {
            let onlyThisGroup = true;
            for (let otherGroup of allGroups) {
              if (otherGroup !== group && otherGroup.size >= group.size) {
                let otherMinterms = new Set(otherGroup.cells.map(([r, c]) => kmapOrder[c][r]));
                if (otherMinterms.has(minterm)) {
                  onlyThisGroup = false;
                  break;
                }
              }
            }
            if (onlyThisGroup) {
              isEssential = true;
              break;
            }
          }
        }
        
        if (isEssential) {
          selectedGroups.push(group);
          groupMinterms.forEach(m => coveredMinterms.add(m));
        }
      }
      
      // Then, cover remaining minterms with largest possible groups
      for (let group of allGroups) {
        if (selectedGroups.includes(group)) continue;
        
        let groupMinterms = new Set(group.cells.map(([r, c]) => kmapOrder[c][r]));
        let hasUncovered = false;
        
        for (let minterm of groupMinterms) {
          if (!coveredMinterms.has(minterm)) {
            hasUncovered = true;
            break;
          }
        }
        
        if (hasUncovered) {
          selectedGroups.push(group);
          groupMinterms.forEach(m => coveredMinterms.add(m));
        }
        
        if (coveredMinterms.size === minterms.length) {
          break;
        }
      }
      
      return selectedGroups;
    }
    
    function isValidGroup(cells, minterms) {
      // Check if all cells in the group are minterms
      for (let [r, c] of cells) {
        let num = kmapOrder[c][r];
        if (!minterms.includes(num)) {
          return false;
        }
      }
      return true;
    }

    function drawGroups(groups){
      let container = document.querySelector("table");
      let colorIndex = 0;
      groups.forEach(g=>{
        let color = colors[colorIndex%colors.length];
        colorIndex++;
        
        // For 8-cell groups that are columns, draw each column separately
        if (g.size === 8 && g.type === 'cols') {
          // Group by column
          let columns = {};
          g.cells.forEach(([r, c]) => {
            if (!columns[c]) columns[c] = [];
            columns[c].push([r, c]);
          });
          
          // Draw each column
          Object.values(columns).forEach(colCells => {
            let rect = getBoundingBox(colCells);
            let div = document.createElement("div");
            div.className = "group-box";
            div.style.borderColor = color;
            div.style.left = rect.left + "px";
            div.style.top = rect.top + "px";
            div.style.width = rect.width + "px";
            div.style.height = rect.height + "px";
            container.parentElement.appendChild(div);
          });
        }
        // For 8-cell groups that are rows, draw each row separately
        else if (g.size === 8 && g.type === 'rows') {
          // Group by row
          let rows = {};
          g.cells.forEach(([r, c]) => {
            if (!rows[r]) rows[r] = [];
            rows[r].push([r, c]);
          });
          
          // Draw each row
          Object.values(rows).forEach(rowCells => {
            let rect = getBoundingBox(rowCells);
            let div = document.createElement("div");
            div.className = "group-box";
            div.style.borderColor = color;
            div.style.left = rect.left + "px";
            div.style.top = rect.top + "px";
            div.style.width = rect.width + "px";
            div.style.height = rect.height + "px";
            container.parentElement.appendChild(div);
          });
        }
        // For all other groups, draw as single box
        else {
          let rect = getBoundingBox(g.cells);
          let div = document.createElement("div");
          div.className = "group-box";
          div.style.borderColor = color;
          div.style.left = rect.left + "px";
          div.style.top = rect.top + "px";
          div.style.width = rect.width + "px";
          div.style.height = rect.height + "px";
          container.parentElement.appendChild(div);
        }
      });
    }

    function getBoundingBox(cells){
      let tds = cells.map(([r,c])=>{
        let num=kmapOrder[c][r];
        return document.getElementById("cell-"+num).getBoundingClientRect();
      });
      let top=Math.min(...tds.map(b=>b.top));
      let left=Math.min(...tds.map(b=>b.left));
      let bottom=Math.max(...tds.map(b=>b.bottom));
      let right=Math.max(...tds.map(b=>b.right));
      let container=document.querySelector("table").getBoundingClientRect();
      return {top:top-container.top,left:left-container.left,width:right-left,height:bottom-top};
    }

    function groupToExpression(group){
      let nums=[];
      group.cells.forEach(([r,c])=>{
        nums.push(kmapOrder[c][r]);
      });
      nums=[...new Set(nums)];
      let binaries=nums.map(n=>getBinary(n));
      let expr="";
      for(let i=0;i<4;i++){
        let allSame=binaries.every(b=>b[i]===binaries[0][i]);
        if(allSame){
          expr += binaries[0][i]==="1"?variables[i]:variables[i]+"′";
        }
      }
      return expr||"1";
    }
  </script>

</body>
</html>
